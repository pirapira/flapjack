name: Lean Action CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

      - name: Check for new native_decide uses
        run: ./scripts/check-native-decide.sh

      - name: Check the build is warning-free
        run: ./scripts/check-warnings.sh

      - name: Check exact Pancake RISC-V parity fixtures
        run: |
          lake build flapjack-compile
          python3 scripts/check-parity-goldens.py

      - name: Check guest.pp.pnk exact Pancake RISC-V parity
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/pirapira/stateless-pancaketh/84405317d6705de9df563ad2f6cdd30b459198b4/Guest/guest.pp.pnk \
            --output "$RUNNER_TEMP/guest.pp.pnk"
          python3 scripts/check-guest-parity.py "$RUNNER_TEMP/guest.pp.pnk"

      - name: Check exact Pancake RISC-V parity corpus
        run: python3 scripts/parity-small-corpus.py --flapjack-only

      - name: Check exact Pancake RISC-V global differential smoke
        run: |
          nice -n 10 python3 scripts/parity-difffuzz.py \
            --smoke --include-globals --exact --quiet
